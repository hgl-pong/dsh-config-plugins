# dsh-agnes-provider bundle patch.
# 1) register itself as one Loader row.
# 2) inject the custom provider "agnes" into the llm-pi-ai settings BASE layer
#    (composition base, NOT the user settings.yaml), so the model row survives
#    installs/reinstalls and disappears on uninstall. The route reads the
#    AGNES_API_KEY credential and speaks openai-completions to the Agnes AI
#    API Hub (https://apihub.agnes-ai.com/v1). See:
#    https://www.agnes-ai.com/zh-Hans/docs/agnes-25-flash
#
# Model: agnes-2.5-flash — OpenAI 兼容 Chat Completions，支持文本 / 图像 URL 输入、
#   流式输出、工具调用；上下文窗口 512K，最大输出 65.5K tokens。
# Thinking 通过 chat_template_kwargs.enable_thinking 开关（见 index.js 流钩子），
# 因此 reasoningEfforts 只作“合法 effort 名”白名单（必须含 off 以支持 compaction/ACP）。

- insert:
    - id: dsh-agnes-provider
      name: dsh-agnes-provider

- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      agnes:
        displayName: Agnes AI
        apiKeyEnv: AGNES_API_KEY
        api: openai-completions
        baseURL: https://apihub.agnes-ai.com/v1
        models:
        - id: agnes-2.5-flash
          name: Agnes 2.5 Flash
          contextWindow: 524288
          maxTokens: 65536
          input: [text, image]
          # Agnes Thinking 是 on/off 开关（chat_template_kwargs.enable_thinking），
          # 不是渐进的 reasoning_effort。thinkingFormat 必须是枚举内的合法值：
          #   openai | deepseek | openrouter | together | zai | qwen | chat-template
          #   | qwen-chat-template | string-thinking | ant-ling
          # chat-template 即使用 chat_template_kwargs 的机制，正好对应 Agnes 的
          # chat_template_kwargs.enable_thinking。supportsReasoningEffort:false 表示
          # 不发送渐进档位；reasoningEfforts 只是“合法 effort 名”白名单 —— 必须包含
          # off，否则 compaction/ACP 发送 reasoning_effort:"off" 会被 pi-ai 校验拒绝：
          #   Error: provider "agnes" model "agnes-2.5-flash" does not support reasoning effort "off"
          # off->null 关闭思考；high->high 开启思考（由 index.js 翻译成 enable_thinking）。
          reasoningEfforts: { off: null, high: high }
          compat: { thinkingFormat: chat-template, supportsReasoningEffort: false }
