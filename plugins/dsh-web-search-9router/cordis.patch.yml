# dsh-web-search-9router bundle patch.
# 用 9Router 替换内置的 DeepSeek 联网搜索 provider。
#
# 1) `insert:` 把自己注册为一个 Loader 行，让 index.js 运行并在 ctx.web 上注册 9router provider。
# 2) 覆盖 base 层 `web` 行的 config：把 searchProvider 固定为 9router（本插件的 provider id）。
# 3) 禁用 `web-search-deepseek` 行：避免它继续注册 `deepseek-official` provider（即使被 searchProvider
#    固定跳过，禁用后也更干净、并避免潜在的可用 provider 歧义）。
#
# 环境变量：
#   NINEROUTER_URL  9Router 服务地址（默认 http://localhost:20128）
#   NINEROUTER_KEY  鉴权 key（若 9Router 开启了 auth）
#   NINEROUTER_SEARCH_PROVIDER  默认搜索 provider/model（默认 tavily；支持 exa / brave / serper /
#     searxng / google-pse / linkup / searchapi / youcom / perplexity，也支持 combo）
#
# 说明：搜索走 9Router 的 /v1/search（OpenAI 兼容），不消耗 DeepSeek 模型额度。fetch 保持默认关闭
# （与 base 一致：fetch 涉及 SSRF 防护，未挂载 fetch provider 时开启 tool-web 的 fetch 会报错）。

- insert:
    - id: dsh-web-search-9router
      name: dsh-web-search-9router

- id: web
  name: '@deepseek-ai/dsh-web'
  config:
    searchProvider: 9router

- id: web-search-deepseek
  name: '@deepseek-ai/dsh-web-search-deepseek'
  disabled: true

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000
